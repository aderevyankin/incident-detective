name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # 22.04, потому что на ней доступен Python 3.8 — минимальная заявленная версия.
    # Матрица гоняет ещё и 3.12 — современную версию, которая как раз у
    # большинства пользователей: обратная совместимость не заметна на 3.8 одном.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Прогон проверок
        run: python3 tests/run.py

  bench:
    # Бенчмарк отдельным job'ом: его падение — про скорость, а не про поведение,
    # и смешивать эти два сигнала в одном красном крестике нельзя. Образ тот же,
    # что у основного job, — иначе замеры разных прогонов не сопоставимы.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # одна современная версия: совместимость проверяет матрица основного
          # job, бенчмарку нужен просто рабочий интерпретатор
          python-version: '3.12'
      - name: Бюджеты скорости (щадящий порог)
        # Строгие числа таблицы бюджетов — порог для типовой рабочей машины
        # разработчика, и требовать их от чужого раннера значит получать ложные
        # падения. Здесь ловятся регрессии на порядок: бюджеты времени × 5,
        # скорости ÷ 5.
        #
        # Множитель выверен замером: на рабочей машине (Python 3.10, Darwin arm64,
        # 400 000 строк) самый тесный замер — `parse_logs.py --level ERROR`,
        # 80 тыс. строк/с. С множителем 3 порог вышел бы 50 тыс. — раннер вдвое
        # медленнее рабочей машины уже флапал бы. Множитель 5 даёт порог
        # 30 тыс. строк/с, то есть запас в 2,7 раза; у остальных замеров запас
        # больше пятикратного. Флапнуло — множитель поднимается, job не
        # выключается.
        run: python3 tools/bench.py --budget-scale 5
