name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # 22.04, потому что на ней доступен Python 3.8 — минимальная заявленная версия.
    # Матрица гоняет ещё и 3.12 — современную версию, которая как раз у
    # большинства пользователей: обратная совместимость не заметна на 3.8 одном.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Прогон проверок
        run: python3 tests/run.py

  bench:
    # Бенчмарк отдельным job'ом: его падение — про скорость, а не про поведение,
    # и смешивать эти два сигнала в одном красном крестике нельзя. Образ тот же,
    # что у основного job, — иначе замеры разных прогонов не сопоставимы.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # одна современная версия: совместимость проверяет матрица основного
          # job, бенчмарку нужен просто рабочий интерпретатор
          python-version: '3.12'
      - name: Бюджеты скорости (щадящий порог)
        # Строгие числа таблицы бюджетов — порог для типовой рабочей машины
        # разработчика, и требовать их от чужого раннера значит получать ложные
        # падения. Здесь ловятся регрессии на порядок: бюджеты времени × 3,
        # скорости ÷ 3.
        #
        # Множитель выверен замером в тишине (Python 3.10, Darwin arm64,
        # 400 000 строк, три прогона): самый тесный замер по запасу к бюджету —
        # `parse_logs.py --level ERROR`, 147,9–149,5 тыс. строк/с. Множитель 3
        # даёт порог 50 тыс. строк/с — запас втрое; раннер вдвое медленнее
        # рабочей машины выдаст ~74 тыс. и до порога не достанет. У остальных
        # замеров запас больше. Флапнуло — множитель поднимается, job не
        # выключается.
        #
        # Прежние 80 тыс. строк/с, которыми обосновывался множитель 5, — замер
        # под параллельной нагрузкой: в тишине то же место идёт вдвое быстрее.
        run: python3 tools/bench.py --budget-scale 3
