schema: spec-driven

context: |
  Проект: incident-detective — скилл разбора багов и инцидентов на стендах.

  Целевая платформа: GigaCode CLI; разработка и прогоны идут на Qwen Code, при
  расхождении приоритет у GigaCode. GigaCode — полная калька Qwen Code: те же имена
  инструментов и файлы настроек, отличается только корневой каталог (.gigacode/
  вместо .qwen/). Формат — Agent Skills: директория со SKILL.md (YAML-фронтматтер:
  name, description, priority), плюс references/, scripts/, templates/. Ставится в
  ~/.gigacode/skills/ или .gigacode/skills/ (для Qwen Code — ~/.qwen/skills/ или
  .qwen/skills/). Скиллы читаются при старте CLI, model-invoked — решение о запуске
  принимается по полю description.

  Стек скриптов: Python 3.8+, только стандартная библиотека. Никаких внешних
  зависимостей и сетевых вызовов из скриптов — они должны запускаться на любом
  окружении, где есть python3. Для контура кода дополнительно используется git,
  его отсутствие не должно ломать работу.

  Архитектура — три контура (база знаний, логи, код), связанные общей «валютой» —
  сигнатурой ошибки. Таблица контуров со скриптами и полный перечень границ
  дозволенного — в incident-detective/SKILL.md; здесь они не дублируются, чтобы
  копии не разошлись. Коротко: скилл только диагностирует, изменяющих действий на
  стендах не выполняет, выводов без данных не делает, наблюдаемое и предполагаемое
  разделяет явно, секреты и персональные данные в базу знаний не пишет и своего
  MCP-сервера с собой не тащит.

  Язык интерфейса и документации — русский. Технические идентификаторы, имена
  флагов и ключевые слова спецификаций остаются в оригинальном виде.

rules:
  specs:
    - Требования формулировать через SHALL, сценарии — через WHEN/THEN
    - Каждое требование должно быть проверяемо запуском скрипта или чтением SKILL.md
    - Не описывать реализацию там, где достаточно наблюдаемого поведения
