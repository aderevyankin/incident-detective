schema: spec-driven

context: |
  Проект: incident-triage — скилл разбора багов и инцидентов на стендах.

  Целевая платформа: Qwen Code CLI. Формат — Agent Skills: директория со SKILL.md
  (YAML-фронтматтер: name, description, priority), плюс references/, scripts/,
  templates/. Ставится в ~/.qwen/skills/ или .qwen/skills/. Скиллы читаются при
  старте CLI, model-invoked — решение о запуске принимается по полю description.

  Стек скриптов: Python 3.8+, только стандартная библиотека. Никаких внешних
  зависимостей и сетевых вызовов из скриптов — они должны запускаться на любом
  окружении, где есть python3. Для контура кода дополнительно используется git,
  его отсутствие не должно ломать работу.

  Архитектура — три контура, связанные общей «валютой» (сигнатурой ошибки):
    1. База знаний — markdown-файлы в kb/ + генерируемый index.json
    2. Логи — локальный парсинг неструктурированных разнородных логов
    3. Код — связь ошибки с местом в репозитории и git-историей

  Принципы:
    - Скилл только диагностирует. Никаких изменяющих действий на стендах.
    - Никаких выводов без данных: нет логов и нет совпадения в базе — так и говорим.
    - Наблюдаемое и предполагаемое разделяются явно.
    - Секреты и персональные данные не попадают в базу знаний.
    - Свой MCP-сервер скилл не тащит: использует уже подключённые в окружении.

  Язык интерфейса и документации — русский. Технические идентификаторы, имена
  флагов и ключевые слова спецификаций остаются в оригинальном виде.

rules:
  spec:
    - Требования формулировать через SHALL, сценарии — через WHEN/THEN
    - Каждое требование должно быть проверяемо запуском скрипта или чтением SKILL.md
    - Не описывать реализацию там, где достаточно наблюдаемого поведения
